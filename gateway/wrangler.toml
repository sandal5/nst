name = "nst-fetch-gateway"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Manual-check state store (objects-page checking workflow). Namespace
# created by the account owner 2026-10-28; the id is an identifier, not a
# credential.
[[kv_namespaces]]
binding = "CHECK_KV"
id = "1a9b6a1a90054af29171e82cf897ee54"

# Second-confirmation screenshots for the checking pages. Bucket created
# by the account owner 2026-10-28; it stays private (no public access) —
# images are served only through the gateway's unlisted shots path.
# A Worker binding needs no API keys or extra permissions: the bucket and
# the Worker live in the same account, the binding itself is the grant.
[[r2_buckets]]
binding = "SHOTS"
bucket_name = "nst-shots"

# Registry snapshot store (D1). Database created by the account owner
# 2026-10-29; the id is an identifier, not a credential. Tables are
# defined in worker/schema_registry.sql and loaded through the gateway's
# key-protected d1exec endpoint (no API token exists on the assistant VM).
[[d1_databases]]
binding = "REGISTRY_DB"
database_name = "nst-registry"
database_id = "d9c57c9e-5efc-4590-85a6-e3837434ad85"

# Before first deploy, set the shared secret:
#   npx wrangler secret put GATEWAY_KEY
# The calling clients send it as the X-Gateway-Key header.
